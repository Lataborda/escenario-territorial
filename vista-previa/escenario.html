. En S1 la caña conserva la extensión de S0 y cerca de una cuarta parte pasa a manejo orgánico (P17: más del 20 % en la cuenca baja del Amaime). En la ladera, el mosaico campesino (café con sombrío, plátano, frutales, huertas y pastura) ocupa parcelas pequeñas; el café y el plátano prefieren la franja baja. S1 repite la ladera de S0. S2 conserva la matriz del plano de S0 y diversifica la ladera: las familias en red suman huertas y frutales y reducen la pastura. S3 lleva la diversificación más lejos, con silvopastoreo en la ladera y orillas con bosque.`,estado_texto:`borrador`},edades_cana:{nota:`Fracción de los lotes con caña en cada edad: recién cortado (rastrojo bajo y pajizo), en crecimiento (altura media, verde claro) y maduro (altura plena, con espigas). Valores ilustrativos para el dibujo, sin calibración empírica. La edad es fija por lote e igual en todos los escenarios; la caña orgánica de S1 y S3 conserva la edad del lote.`,fracciones:{cortado:.2,crecimiento:.35,maduro:.45},estado_texto:`borrador`},escenarios:[{id:`S0`,nombre:`Matriz de monocultivo con finca faro`,rotulo:`Situación de partida`,uso:[`M0`,`M1`,`M2`,`M3`],que_se_ve:`Plano dominado por caña, relictos aislados, finca faro, fincas de ladera en sustitución de insumos y siete mercados sin vínculos.`,ficha:`Matriz de monocultivo de caña en el plano, relictos de bosque aislados, una finca faro, fincas de ladera en sustitución de insumos y siete mercados sin vínculos. En Colombia, el 1,33 % del área agrícola está en producción alternativa.`,fuentes:[`res331:verificar`],estado_texto:`borrador`,coberturas:{plano:{parcelas:{cana:.86,pastura:.09,bosque_seco:.03,humedal:.02},orillas:{ripario:.15,cana:.6,pastura:.25}},piedemonte:{parcelas:{cana:.45,pastura:.47,bosque_seco:.08},orillas:{ripario:.3,pastura:.7}},ladera:{parcelas:{pastura:.4,cafe:.3,platano:.1,frutales:.06,huerta:.04},orillas:{ripario:.45,pastura:.35,cafe:.1,platano:.05}},bosque_altoandino:{celdas:{bosque_altoandino:1}},paramo:{celdas:{paramo:1 ué la excelencia agroecológica en la finca no produce por sí sola transición territorial?`,resultado_aprendizaje:`Al finalizar la sesión, el estudiante explica qué procesos de la transición exigen escalas supraprediales, distingue agroecosistema mayor y territorio por el límite y el sujeto de decisión, e identifica en un territorio concreto las condiciones de territorialización ausentes.`,evaluacion:`Tarea auténtica: diagnóstico de un territorio en dos páginas y defensa oral de cinco minutos.`,prerrequisitos:`Ecología de agroecosistemas y fundamentos de sistemas alimentarios.`,fuentes:[`res356:art. 11`,`resumenes:ESTRATEGIA §11`],verificar:[`Curso hipotético y prerrequisitos redactados sin Alejandro en la sesión en la nube (decisión D4).`]},momentos:[{id:`M0`,nombre:`Encuadre`,meta:3,escala:`territorio`,escenarios:[`S0`]},{id:`M1`,nombre:`Agroecosistema y estructura`,meta:6,escala:`finca`,escenarios:[`S0`]},{id:`M2`,nombre:`Procesos supraprediales`,meta:7,escala:`suelo a región`,escenarios:[`S0`]},{id:`M3`,nombre:`Cambio de objeto`,meta:8,escala:`territorio`,escenarios:[`S0`,`S1`]},{id:`M4`,nombre:`Territorialización`,meta:8,escala:`territorio`,escenarios:[`S0`,`S1`,`S2`]},{id:`M5`,nombre:`Medición`,meta:5,escala:`finca y territorio`,escenarios:[`S2`]},{id:`M6`,nombre:`Cierre`,meta:3,escala:`territorio y finca`,escenarios:[`S3`]}],paradas:[{id:`P01`,momento:`M0`,minutos:1.5,saltable:!1,titulo:`Ficha de sesión`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[`ficha_sesion`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Sesión de posgrado (maestría y doctorado). Resultado de aprendizaje: explicar qué procesos de la transición exigen escalas supraprediales, distinguir agroecosistema mayor y territorio por el límite y el sujeto de decisión, e identificar en un territorio concreto las condiciones de territorialización ausentes. Evaluación: tarea auténtica con diagnóstico territorial.`,notas:`Abrir sobre la vista aérea. Presentar curso, nivel, resultado de aprendizaje, evaluación y prerrequisitos según la ficha de sesión. La maqueta es la herramienta pedagógica de la clase.`,fuentes:[`res356:art. 11`,`resumenes:ESTRATEGIA §11`],estado_texto:`borrador`},{id:`P02`,momento:`M0`,minutos:1.5,saltable:!1,titulo:`Pregunta detonante y situación de partida`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[`pregunta_detonante`,`rotulos_zonas`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`¿Por qué la excelencia agroecológica en la finca no produce por sí sola transición territorial? En Colombia, 61.435,70 ha de 4.617.116 ha del área agrícola están en producción alternativa (1,33 %). El país cuenta con 104 escuelas agroecológicas: Cauca 16, Valle del Cauca 10, Nariño 8.`,notas:`Formular la pregunta y dejarla abierta hasta el cierre. Recorrer con la mirada el plano de caña, la ladera y los mercados. Las cifras provienen de la Res. 331 de 2024, con base en ENA 2019 y MADR-AICD 2023.`,fuentes:[`res331:verificar`],verificar:[`Página de la Res. 331 de 2024 con el área en producción alternativa (61.435,70 ha de 4.617.116 ha) y el conteo de escuelas agroecológicas por departamento.`],estado_texto:`borrador`},{id:`P03`,momento:`M1`,minutos:1.5,saltable:!1,titulo:`Niveles de organización`,escala:`planta`,camara:{ancla:`lote`,distancia:160,azimut:-30,elevacion:30,duracion:2.5},estado:{escenario:`S0`,capas:[`niveles_organizacion`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},pasos:[{id:`organismo`,rotulo:`Organismo`},{id:`poblacion`,rotulo:`Población`},{id:`comunidad`,rotulo:`Comunidad`},{id:`ecosistema`,rotulo:`Ecosistema`}],ficha:`Cuatro niveles de organización en el agroecosistema: organismo, población, comunidad y ecosistema. El recorrido parte de una planta del lote, sigue con la población del cultivo y la comunidad del policultivo, y termina en la finca dentro de su cuenca.`,notas:`Avanzar los cuatro pasos con la flecha. Señalar las propiedades que aparecen en cada nivel.`,fuentes:[`gliessman:fig. 3.1`],verificar:[`Pasaje de Gliessman (cap. 3) sobre las propiedades emergentes de cada nivel, si se mencionan en la exposición.`],estado_texto:`borrador`},{id:`P04`,momento:`M1`,minutos:1.5,saltable:!1,titulo:`Agroecosistema menor y agroecosistema mayor`,escala:`finca`,camara:{ancla:`F3`,distancia:450,azimut:-30,elevacion:45,duracion:2.5},estado:{escenario:`S0`,capas:[`agroecosistema_menor_mayor`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Agroecosistema menor: el lote o cultivo, mínima unidad conmensurable. Agroecosistema mayor: la finca, unidad ambiental con lindero de propiedad privada o comunal y con la familia dentro del lindero. El agroecosistema mayor contiene relaciones de poder, mercado y política pública.`,notas:`Resaltar primero el lote y después el lindero con la familia. Contrastar la frontera del agroecosistema según Gliessman y según León-Sicard.`,fuentes:[`leonsicard:pp. 24 a 26`,`gliessman:p. 37`],verificar:[`Criterio de frontera del agroecosistema en Gliessman (p. 37), para redactar el contraste con León-Sicard.`],estado_texto:`borrador`},{id:`P05`,momento:`M1`,minutos:1.5,saltable:!1,titulo:`Estructura Agroecológica Principal`,escala:`finca`,camara:{ancla:`F3`,distancia:450,azimut:-55,elevacion:50,duracion:2.5},estado:{escenario:`S0`,capas:[`conectores_eap`,`eep`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Estructura Agroecológica Principal (EAP): configuración espacial de la agrobiodiversidad de la finca y su conectividad. Comprende conectores internos y externos y la conexión con la estructura ecológica principal (EEP) del paisaje. El índice EAP reúne diez criterios en dos grupos.`,notas:`Mostrar los conectores internos, luego los externos y la conexión con la EEP. Nombrar los dos grupos de criterios.`,fuentes:[`leonsicard:p. 31`,`leonsicard:cap. 3`,`cleves:verificar`],verificar:[`Nombres de los diez criterios de la EAP y de sus dos grupos (León-Sicard 2021, cap. 3; Cleves-Leguízamo et al. 2017).`],estado_texto:`borrador`},{id:`P06`,momento:`M1`,minutos:1.5,saltable:!1,titulo:`Finca faro en el plano`,escala:`finca`,camara:{ancla:`F1`,distancia:450,azimut:-30,elevacion:40,duracion:2.5},estado:{escenario:`S0`,capas:[`rotulos_finca`,`conectores_eap`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Finca faro, referencia El Hatico (esquema sin escala). 288 ha: sistema silvopastoril 140 ha, caña agroecológica 100 ha, guadual 26 ha, bosque 14 ha, frutales 5 ha y corredores 2 ha. Una isla de diversidad en la matriz de caña del plano.`,notas:`Recorrer los usos de la finca. Anticipar que la finca faro tiene influencia documentada en otras escalas (M3).`,fuentes:[`calle:§11.1`],verificar:[`Los usos listados suman 287 ha de 288 ha; confirmar en Calle et al. (2022, §11.1) el uso restante.`],estado_texto:`borrador`},{id:`P07`,momento:`M2`,minutos:1.5,saltable:!1,titulo:`Biota del suelo`,escala:`suelo`,camara:{ancla:`corte_suelo`,distancia:70,azimut:-30,elevacion:12,duracion:2.5},estado:{escenario:`S0`,capas:[`corte_suelo`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`La biota del suelo cierra su ciclo en el lote y la finca. Raíces, hifas y macrofauna transforman la materia orgánica bajo el lote. Materia orgánica en la caña agroecológica de la finca faro: de 2 % a 4 %. Bosque de referencia: 4,3 %.`,notas:`Rótulo «cierra en la finca». Afirmar que todo proceso exige territorio sería un error (GUION, precaución 2). Citar la tradición de biología del suelo de Palmira (Sánchez de Prager, 2018).`,fuentes:[`gliessman:cap. 8`,`calle:verificar`,`sanchezprager:verificar`],verificar:[`Sección de Calle et al. (2022, cap. 11) con la materia orgánica de la caña agroecológica; precisar si «de 2 % a 4 %» es un cambio en el tiempo o un intervalo.`],estado_texto:`borrador`},{id:`P08`,momento:`M2`,minutos:1.5,saltable:!1,titulo:`Control biológico y polinización`,escala:`vereda`,camara:{ancla:`F1`,distancia:900,azimut:-30,elevacion:40,duracion:2.5},estado:{escenario:`S0`,capas:[`radios_enemigos_naturales`,`radios_polinizadores`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Los enemigos naturales requieren hábitat, refugio y presa alternativa fuera del lote. Los polinizadores forrajean y anidan en rangos que exceden el predio. Los radios de acción desde los parches de hábitat se superponen entre fincas vecinas. En la finca faro se documentan enemigos naturales.`,notas:`Mostrar los radios que salen del lindero. La escala mínima de ambos procesos es la matriz y el paisaje.`,fuentes:[`gliessman:cap. 14`,`gliessman:cap. 18`,`calle:§11.6`],estado_texto:`borrador`},{id:`P09`,momento:`M2`,minutos:1.5,saltable:!1,titulo:`Agua y sedimentos en la cuenca`,escala:`cuenca`,camara:{ancla:`rio_tributario`,distancia:1400,azimut:-65,elevacion:35,duracion:2.5},estado:{escenario:`S0`,capas:[`escorrentia_sedimentos`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`La unidad hidrológica es la cuenca. La escorrentía de la ladera arrastra sedimentos al río según la cobertura del suelo. Las curvas a nivel, las barreras vivas, las terrazas y la infiltración retienen agua y suelo en la finca. El efecto sobre el río depende del conjunto de fincas de la cuenca.`,notas:`Seguir el agua desde el páramo hasta el río Cauca. Señalar el acueducto comunitario.`,fuentes:[`gliessman:cap. 8`,`gliessman:cap. 18`],verificar:[`Pasajes de Gliessman (caps. 8 y 18) sobre escorrentía, sedimentos y prácticas de conservación de suelos.`],estado_texto:`borrador`},{id:`P10`,momento:`M2`,minutos:1,saltable:!1,titulo:`Brecha metabólica entre campo y ciudad`,escala:`region`,camara:{ancla:`general`,distancia:3100,azimut:-30,elevacion:42,duracion:2.5},estado:{escenario:`S0`,capas:[`flujos_nutrientes`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Los ciclos de nitrógeno y fósforo no cierran cuando el sistema exporta alimento a la ciudad. Los nutrientes salen de las fincas hacia la ciudad y no regresan al suelo. Esta ruptura entre campo y ciudad recibe el nombre de brecha metabólica.`,notas:`Mostrar los arcos de nutrientes sin retorno. En S3 los arcos tienen retorno.`,fuentes:[`lopezgdm:§4`,`padro:verificar`],estado_texto:`borrador`},{id:`P11`,momento:`M2`,minutos:1,saltable:!1,titulo:`Semillas en red de custodios`,escala:`territorio`,camara:{ancla:`ladera`,distancia:1800,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[`red_semillas`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Los sistemas de semillas funcionan en red. El flujo genético depende de los intercambios entre familias custodias de distintas fincas y veredas. La escala mínima del proceso es el territorio de la red de custodios.`,notas:`Mostrar los intercambios entre custodios de la ladera y del resguardo.`,fuentes:[`gliessman:cap. 11`,`res331:lineamiento 4`],estado_texto:`borrador`},{id:`P12`,momento:`M2`,minutos:.5,saltable:!0,titulo:`Escala mínima de cada proceso`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[`escala_minima`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Control biológico y polinización: matriz y paisaje. Ciclos de nitrógeno y fósforo: región, ciudad y campo. Agua y sedimentos: cuenca. Semillas: territorio y red de custodios. Biota del suelo: lote y finca. Cada proceso tiene su propia escala mínima.`,notas:`La biota del suelo se muestra con el mismo peso que las demás filas.`,fuentes:[`resumenes:ESTRATEGIA §5`],estado_texto:`borrador`},{id:`P13`,momento:`M3`,minutos:1.5,saltable:!1,titulo:`Límite y sujeto de decisión`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:45,duracion:2.5},estado:{escenario:`S0`,capas:[`lindero_territorio`,`actores`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`La finca y el territorio se distinguen por el límite y el sujeto de decisión. El agroecosistema mayor tiene un lindero de propiedad y una familia que decide. El territorio tiene un límite definido por los actores y un sujeto plural. Ambos contienen relaciones de poder, mercado y política pública.`,notas:`El agroecosistema mayor ya contiene poder, mercado y política pública (GUION, precaución 1). El contraste se plantea solo por el límite y el sujeto.`,fuentes:[`leonsicard:p. 24`,`resumenes:ESTRATEGIA §5`],estado_texto:`borrador`},{id:`P14`,momento:`M3`,minutos:2.5,saltable:!1,titulo:`Cuatro lecturas del territorio`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},pasos:[{id:`L1`,rotulo:`① Sociotécnica francesa`,estado:{lente:`L1`}},{id:`L2`,rotulo:`② Agronómico-territorial europea`,estado:{lente:`L2`}},{id:`L3`,rotulo:`③ Agroecología política española`,estado:{lente:`L3`}},{id:`L4`,rotulo:`④ Territorial latinoamericana`,estado:{lente:`L4`}}],ficha:`Una maqueta, cuatro lecturas. Sociotécnica francesa: escala de coordinación de actores en torno a un régimen. Agronómico-territorial europea: área delimitada con transición en marcha. Agroecología política española: esfera de agregación de fuerzas sociales en un sujeto plural. Territorial latinoamericana: espacio socialmente construido y en disputa.`,notas:`Avanzar las cuatro lentes con la flecha. Al cierre, contrastar la cita de Magrini et al. con el título de Giraldo y Rosset (2018), solo después de verificar la cita textual y su página.`,fuentes:[`resumenes:ESTRATEGIA §4`,`magrini:verificar`,`wezel2016:verificar`,`lopezgdm:verificar`,`levidow:verificar`],estado_texto:`borrador`},{id:`P15`,momento:`M3`,minutos:1,saltable:!0,titulo:`Bloqueo del régimen`,escala:`region`,camara:{ancla:`plano`,distancia:1700,azimut:-30,elevacion:42,duracion:2.5},estado:{escenario:`S0`,capas:[`mecanismos_bloqueo`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`El régimen de la caña se autorrefuerza por retornos crecientes de adopción. Cinco mecanismos: aprendizaje por uso, externalidades de red, economías de escala, retornos informacionales crecientes e interrelación tecnológica. El aislamiento de la finca agroecológica resulta estructural.`,notas:`Ubicar los cinco mecanismos sobre el ingenio y la matriz. Magrini et al. los toman de Arthur (1989).`,fuentes:[`magrini:verificar`],verificar:[`Pasaje de Magrini et al. con los cinco mecanismos de retornos crecientes (con base en Arthur 1989).`],estado_texto:`borrador`},{id:`P16`,momento:`M3`,minutos:1.5,saltable:!1,titulo:`El paisaje como registro`,escala:`vereda`,camara:{ancla:`plano`,distancia:1400,azimut:-30,elevacion:50,duracion:2.5},estado:{escenario:`S0`,capas:[`capa_historica`],lente:null,anio:`1957`,condiciones:[],modo:`recorrido`},pasos:[{id:`1957`,rotulo:`1957`,estado:{anio:`1957`}},{id:`1986`,rotulo:`1986`,estado:{anio:`1986`}},{id:`hoy`,rotulo:`Hoy`,estado:{anio:`hoy`}}],ficha:`El plano del valle suma 421.000 ha. Entre 1957 y 1986 se transformó el 66 % de la cobertura forestal de la cuenca alta del río Cauca. Hoy queda el 1,76 % del bosque original, en fragmentos de 6 ha en promedio; cerca del 75 % de los fragmentos dista 500 m o más del vecino más cercano.`,notas:`Avanzar 1957, 1986 y hoy. Los humedales ocuparon casi una cuarta parte del valle. Calle et al. se apoyan en CVC (1990), Arcila et al. (2012) y Rivera et al. (2007).`,fuentes:[`calle:§11.2`,`leonsicard:presentación`],estado_texto:`borrador`},{id:`P17`,momento:`M3`,minutos:1.5,saltable:!1,titulo:`Escalamiento sin territorialización`,escala:`territorio`,camara:{ancla:`F1`,distancia:2e3,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S1`,capas:[`flujos_conocimiento`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Entre 2005 y 2016 la finca faro recibió 13.732 visitantes de 815 instituciones y 59 países. En el Valle, más de 20.000 ha de caña pasaron a producción orgánica; en la cuenca baja del Amaime, más del 20 % de la caña está en manejo orgánico. La geometría de la matriz permanece.`,notas:`La influencia de la finca faro es escalamiento vertical y sustitución de insumos dentro de la matriz (GUION, precaución 3). Mostrarla sin efecto sería inexacto. Calle et al. citan a Murgueitio (2019).`,fuentes:[`calle:§11.7`,`calle:§11.8`],estado_texto:`borrador`},{id:`P18`,momento:`M4`,minutos:1,saltable:!1,titulo:`Siete mercados desarticulados`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[`mercados`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Antes de 2009, siete mercados agroecológicos funcionaban en cabeceras municipales del Valle del Cauca sin vínculos entre ellos. Referencia REDMAC, esquema sin escala.`,notas:`Señalar cada mercado aislado. Preparar la actividad de la parada siguiente.`,fuentes:[`redmac:verificar`],verificar:[`Fuente citable para los siete mercados anteriores a 2009 (REDMAC).`],estado_texto:`borrador`},{id:`P19`,momento:`M4`,minutos:4,saltable:!1,titulo:`Actividad de condiciones de territorialización`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S0`,capas:[`mercados`,`teoria_cambio`],lente:null,anio:`hoy`,condiciones:[],modo:`actividad`},ficha:`¿Qué tuvo que ocurrir para que siete mercados que no se hablaban se volvieran una red? Activen las condiciones una por una y observen el efecto en la maqueta. Cuando una condición activa no produce efecto territorial, la maqueta indica qué condición falta.`,notas:`Los estudiantes proponen condiciones y el presentador las activa. Las reglas son didácticas y carecen de calibración empírica; decirlo al jurado.`,fuentes:[`zollet:§4`],estado_texto:`borrador`},{id:`P20`,momento:`M4`,minutos:1.5,saltable:!1,titulo:`Red de mercados desde 2009`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:40,duracion:2.5},estado:{escenario:`S2`,capas:[`red_mercados`,`poligono_red`,`spg`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Desde 2009, la red reúne cerca de 500 familias y 330 productoras en 23 municipios: 18 del Valle del Cauca y 5 del norte del Cauca. Su territorio cruza el límite departamental. Antecedente: sistema participativo de garantías con el GIA de la Universidad Nacional (proyecto QUIPU 31401001406, 2015).`,notas:`Mostrar el polígono de la red sobre el límite departamental. El SPG con el GIA se cita como antecedente (GUION, precaución 5).`,fuentes:[`redmac:verificar`,`resumenes:ESTRATEGIA §8`,`resumenes:ESTRATEGIA §9`],verificar:[`Cifras de REDMAC (cerca de 500 familias, 330 productoras, 23 municipios) consultadas en línea en septiembre de 2026; citar antes de la prueba (GUION, precaución 9).`],estado_texto:`borrador`},{id:`P21`,momento:`M4`,minutos:1.5,saltable:!1,titulo:`Sujeto plural y circuitos cortos`,escala:`territorio`,camara:{ancla:`ciudad`,distancia:1800,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S2`,capas:[`proximidades`,`compras_publicas`,`actores`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`La red agrega familias productoras, consumidores, escuelas y aliados en un sujeto plural. Las proximidades entre productores y consumidores sostienen los circuitos cortos de comercialización. La Ley 2046 de 2020 establece un mínimo de 30 % en las compras públicas de alimentos.`,notas:`Vincular la ciudad, los colegios y los mercados. Definición de circuitos cortos según la Ley 2046 de 2020.`,fuentes:[`lopezgdm:§6`,`levidow:§2.2`,`ley2046:verificar`],verificar:[`Artículo de la Ley 2046 de 2020 que fija el mínimo de 30 % y su alcance (productores y entidades obligadas).`],estado_texto:`borrador`},{id:`P22`,momento:`M5`,minutos:2,saltable:!1,titulo:`Índice EAP de tres fincas tipo`,escala:`finca`,camara:{ancla:`piedemonte`,distancia:1300,azimut:-30,elevacion:45,duracion:2.5},estado:{escenario:`S2`,capas:[`indices_eap`,`conectores_eap`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Índice EAP de tres fincas tipo: finca faro del plano, finca de ladera en sustitución de insumos y finca de ladera diversificada en red. Los valores comparan la conectividad interna y externa de cada finca. Valores ilustrativos.`,notas:`Las tres fincas tipo son F1, F2 y F3. Los valores son ilustrativos salvo medición (GUION, precaución 8).`,fuentes:[`leonsicard:cap. 3`],estado_texto:`borrador`},{id:`P23`,momento:`M5`,minutos:1.5,saltable:!0,titulo:`MESMIS y TAPE`,escala:`finca`,camara:{ancla:`F2`,distancia:600,azimut:-30,elevacion:45,duracion:2.5},estado:{escenario:`S2`,capas:[`mesmis_tape`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`MESMIS, marco de evaluación de sustentabilidad, aplicado en fincas de ladera de Ayacucho (Palmira), entre 1.400 y 1.800 m. TAPE caracteriza la transición con los diez elementos de la agroecología (CAET) y evalúa el desempeño de la finca.`,notas:`Romero et al. (2023) falta en la carpeta. Mottet et al. (2020) presentan TAPE.`,fuentes:[`romero:verificar`,`mottet:verificar`],verificar:[`Aplicación de MESMIS en Ayacucho y altitudes de 1.400 a 1.800 m (Romero et al. 2023, falta en la carpeta).`],estado_texto:`borrador`},{id:`P24`,momento:`M5`,minutos:1.5,saltable:!1,titulo:`Soberanía de los datos`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S2`,capas:[`registro_iniciativas`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`El registro de iniciativas agroecológicas implicaba acceso a internet. En Amazonas, Guainía, San Andrés y Providencia y Vaupés no se registraron procesos, «debido, posiblemente, a la carencia de conectividad a internet y/o información, y no por falta de procesos agroecológicos». Líneas 1.1 y 1.6 de la política.`,notas:`Pregunta para el grupo: quién mide y con qué medios. La Res. 331 de 2024 se apoya en MADR-FAO (2024a).`,fuentes:[`res331:verificar`],verificar:[`Página de la cita textual en la Res. 331 de 2024 y contenido de las líneas 1.1 y 1.6.`],estado_texto:`borrador`},{id:`P25`,momento:`M6`,minutos:1.5,saltable:!1,titulo:`Objetivo territorial e instrumento predial`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S3`,capas:[`horizonte_territorial`,`ippta`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`La Política Pública de Agroecología fija un objetivo general de alcance territorial. Su línea 2.2 propone un instrumento de planificación predial (IPPTA). Sobre el horizonte territorial, el instrumento ilumina una sola finca. Un objetivo territorial requiere instrumentos de escala territorial.`,notas:`Mostrar el horizonte territorial y, sobre él, el IPPTA en una sola finca. El argumento corresponde al supuesto H5.`,fuentes:[`res331:objetivo general`,`res331:línea 2.2`],estado_texto:`borrador`},{id:`P26`,momento:`M6`,minutos:1.5,saltable:!1,titulo:`Tarea auténtica y retorno a la pregunta`,escala:`territorio`,camara:{ancla:`general`,distancia:2500,azimut:-30,elevacion:38,duracion:2.5},estado:{escenario:`S3`,capas:[`tarea`,`pregunta_detonante`],lente:null,anio:`hoy`,condiciones:[],modo:`recorrido`},ficha:`Tarea: «Elijan un territorio. Diagnostiquen en qué nivel está su sistema productivo dominante, identifiquen qué mecanismo de territorialización está ausente, y propongan un instrumento de la Política 0331 que lo active. Dos páginas + defensa oral de 5 minutos.» ¿Por qué la excelencia agroecológica en la finca no produce por sí sola transición territorial?`,notas:`Volver a la pregunta detonante con la maqueta en S3 y cerrar con la tarea.`,fuentes:[`resumenes:ESTRATEGIA §11`],estado_texto:`borrador`}]},qx=Kx.paradas,Jx=Kx.momentos,Yx=new Map(qx.map((e,t)=>[e.id,t])),Xx=e=>qx[Yx.get(e)]??null,Zx=e=>Yx.has(e)?Yx.get(e)+1:null,Qx=e=>Math.max(1,e.pasos?.length??0);function
